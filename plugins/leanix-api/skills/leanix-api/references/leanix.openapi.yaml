    name: MIT (this derived file); SAP LeanIX API and documentation are owned by SAP SE
    identifier: MIT
servers:
- url: https://{subdomain}.leanix.net
  description: Your SAP LeanIX instance; the subdomain is the first label of the workspace URL
  variables:
    subdomain:
      default: app
      description: e.g. app, eu, us, de, uk, ch, au, ca, br, ae, jp, sg or an SSO company domain
security:
- bearerAuth: []
tags:
- name: MTM
