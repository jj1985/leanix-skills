  /services/pathfinder/v1/metaModel/permissionRoles:
    get:
      tags:
      - Pathfinder
      summary: Retrieve Meta Model permission roles
      description: '

        Retrieve **Meta Model permission role** details (e.g. granular permissions for *permission roles* for **Fact
        Sheet types**, **Fact Sheet fields** and *translation*) in a human readable format.

        '
      operationId: getMetaModelPermissionRoles
      parameters:
      - name: role
        in: query
        description: Filters **permission** to only include those for the specified **Meta Model permission role**
          (e.g., `MEMBER`, `VIEWER` or *custom roles*).
        allowEmptyValue: true
        schema:
          type: string
      - name: language
        in: query
        description: The *language key* for which translations should be included in the result (e.g. `en`, `de`,
          `ja`).
        allowEmptyValue: true
        schema:
          type: string
      - name: factSheetType
        in: query
        description: Filters **permission** to only include those for the specified **Meta Model Fact Sheet type**
          (e.g., `Application`).
        allowEmptyValue: true
        schema:
          type: string
      - name: excludePermissions
        in: query
        description: Defines whether **permissions** should be excluded from the response or not.
        allowEmptyValue: true
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pf_HttpServletRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pf_AuthorizationModelResponse'
              example:
                data:
                - role: VIEWER
                  type: PermissionRole
                  permissions:
                  - type: FACT_SHEETS
                    node: Application
                    operations:
                      read: true
                      update: true
                  - type: FACT_SHEET_FIELDS
                    node: Application.information.nameDescription.release
                    operations:
                      read: true
                  - type: FACT_SHEET_FIELDS
                    node: Application.information.nameDescription.alias
                    operations:
                      read: true
                  - type: FACT_SHEET_FIELDS
                    node: Application.information.nameDescription.externalId
                    operations:
                      read: true
                  - type: FACT_SHEET_FIELDS
                    node: Application.information.nameDescription.lxProductCategory
                    operations:
                      read: true
                  - type: FACT_SHEET_FIELDS
                    node: Application.information.nameDescription.lxDoraDORACritical
                    operations:
                      read: true
                  - type: FACT_SHEET_FIELDS
                    node: Application.information.nameDescription.lxCatalogId
                    operations:
                      read: true
                  - type: FACT_SHEET_FIELDS
                    node: Application.information.nameDescription.test
                    operations:
                      read: true
                total: 0
          description: OK
        '400':
          description: The request could not be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pf_BasicPFResponse'
        '401':
          description: The API user is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pf_BasicPFResponse'
        '404':
          description: The given `id` does not refer to a valid **job**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pf_BasicPFResponse'
        '500':
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pf_BasicPFResponse'
  /services/pathfinder/v1/metaModel/actions/auditLog:
    get:
      tags:
      - Pathfinder
      summary: Retrieve Meta Model actions audit log
      description: "\nRetrieves a list of **audit log entries** with detailed information about **Meta Model actions**\
        \ performed within the given *workspace*, \nincluding the *user* who executed each change.\n"
      operationId: getMetaModelActionsAuditLog
      parameters:
      - name: node
        in: query
        description: The `node` for which the **audit log** should be fetched (e.g. `Application`, `Application.information`).
        required: true
        schema:
          type: string
      - name: traverse
        in: query
        description: '

          Defines whether all underlying **Meta Model action nodes** should be traversed/included in the result.


          **Example:**

          ```

          node: "Application"

          traverse: true

          ```

          This will also include other **nodes** that exist directly under `Application`, e.g. `Application.information`,
          `Application.information.nameDescription`.

          '
        required: true
        schema:
          type: boolean
      - name: type
        in: query
        description: Filters **actions** to only include those matching the specified **Meta Model action type**
          (e.g., `CREATE_ITEM`, `DELETE_ITEM`).
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - CREATE_ITEM
          - CONDITION
          - UPDATE_DATA
          - UPDATE_VIEW
          - UPDATE_TRANSLATION
          - MOVE_ITEM
          - DELETE_ITEM
          - RENAME_ITEM
          - PERMISSION
          - PERMISSION_ROLE
          - CUSTOM_PERMISSION
          - FACT_SHEET_TYPE
          - FACT_SHEET_FIELD
          - FACT_SHEET_FIELD_VALUE
          - SECTION
          - SUBSECTION
          - RELATION
          - RELATION_FIELD
          - RELATION_FIELD_VALUE
          - EXTERNAL_ID
          - EXTERNAL_ID_FIELD
          - EXTERNAL_ID_FIELD_VALUE
          - PROJECT_STATUS
          - FIELD_VALUE
          - NAMING_RULE
          - NOT_SUPPORTED_ANYMORE
      - name: subtype
        in: query
        description: Filters **actions** to only include those matching the specified **Meta Model action subtype**
          (e.g., `FACT_SHEET_TYPE`, `SECTION`).
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - FACT_SHEET_TYPE
          - SECTION
          - SUBSECTION
          - RELATION
          - FIELD_FACT_SHEET
          - FIELD_EXTERNAL_ID
          - FIELD_RELATION
          - FIELD_VALUE
          - PROJECT_STATUS
          - PERMISSION
          - TRANSLATE
          - CREATE
          - UPDATE
          - DELETE
          - MOVE
          - RENAME
          - UPDATE_DATA
          - UPDATE_VIEW
          - AI_AGENT_INSTANCES
          - IMPACT_MANAGEMENT
          - MILESTONES
          - NOT_SUPPORTED_ANYMORE
      - name: orderBy
        in: query
        description: 'Field by which to sort the returned **actions** (e.g., `updatedAt`, `createdAt`). Default:
          `updatedAt`.'
        allowEmptyValue: true
        schema:
          type: string
      - name: sortOrder
        in: query
        description: 'Sorting direction; either ascending (`ASC`) or descending (`DESC`). Can be used in combination
          with `orderBy`. Default: `DESC`'
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: startDate
        in: query
        description: Filters **actions** to include only those with a *start date* on or after the specified value,
          in `ISO 8601` format (e.g., `2024-06-01`)
        allowEmptyValue: true
        schema:
          type: string
      - name: endDate
        in: query
        description: Filters **actions** to include only those with a *en date* on or before the specified value,
          in `ISO 8601` format (e.g., `2024-06-01`)
        allowEmptyValue: true
        schema:
          type: string
      - name: page
        in: query
        description: 'The page number to retrieve for paginated results, starting at `1` (default: `1`).'
        required: true
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: 'The page size to retrieve for paginated results, with a minimum of `0` and a maximum of `10000`
          (default: `30`).'
        required: true
        schema:
          type: integer
          format: int32
