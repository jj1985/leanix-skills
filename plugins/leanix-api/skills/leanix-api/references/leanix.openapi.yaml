            -> get only the payload property of the event (default behavior), WRAPPED_EVENT -> get the whole serialized
            event as the payload, NO_PAYLOAD -> get always an empty {} payload'
          enum:
          - DEFAULT
          - WRAPPED_EVENT
          - NO_PAYLOAD
        active:
          type: boolean
        deliveryType:
          type: string
          description: The discriminator property to differentiate between subscription types.
          enum:
          - PUSH
          - PULL
        workspaceConstraint:
          type: string
          description: 'Specifies how the workspaceId is used on events:  WORKSPACE -> get events with specified
            workspaceId (workspaceId must not be null), NO_WORKSPACE -> get events that have no workspaceId (workspaceId
            must be null), ANY -> get all events regardless if a workspaceId is assigned or not on the event'
          enum:
          - WORKSPACE
          - NO_WORKSPACE
          - ANY
        id:
          type: string
          format: uuid
        identifier:
          maxLength: 255
          type: string
      discriminator:
        propertyName: deliveryType
