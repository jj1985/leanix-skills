components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /services/mtm/v1/oauth2/token (valid 3600 s)
    apiTokenBasic:
      type: http
      scheme: basic
      description: 'Only for the token endpoint: username literally `apitoken`, password = the technical user''s
        API token'
  schemas:
    Mtm_AccessTokenResponse:
      type: object
      properties:
        scope:
          type: string
        expired:
          type: boolean
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
    Mtm_Account:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 128
          minLength: 2
          type: string
        fromAddress:
          type: string
          format: email
        aiAvailable:
          type: boolean
        sapCrmId:
          type: string
        sapPaperCustomer:
          type: boolean
        sapAiUnitsAvailable:
          type: boolean
        links:
          type: array
          items:
            $ref: '#/components/schemas/Mtm_Link'
        responsibleUser:
          $ref: '#/components/schemas/Mtm_User'
        passwordPolicy:
          type: string
          enum:
          - NORMAL
          - STRICT
        fTEA:
          type: boolean
        fTEAManualOverride:
          type: boolean
    Mtm_Account_Public:
      required:
      - name
      type: object
      properties:
