paths:
  /services/mtm/v1/oauth2/token:
    post:
      tags:
      - MTM
      description: HTTP Basic with username `apitoken` and the API token as password; body `grant_type=client_credentials`
        (application/x-www-form-urlencoded). The JWT in `access_token` is valid for `expires_in` seconds (3600).
      operationId: token
      parameters:
      - name: allowInactiveWorkspace
        in: query
        schema:
          type: boolean
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                code:
                  type: string
                grant_type:
                  type: string
                redirect_uri:
                  type: string
                refresh_token:
                  type: string
                username:
                  type: string
                password:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mtm_AccessTokenResponse'
          description: OK
        '401':
          description: Unauthorized
      summary: Exchange a technical user's API token for a bearer JWT
      security:
      - apiTokenBasic: []
